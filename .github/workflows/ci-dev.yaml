name: CI Pipeline Dev
on:
  push:
    branches: [ dev ]
env:
  IMAGE_NAME: intranet-newdeal
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Image
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:dev .

      # --- POINT 5.2 : LE SCAN TRIVY ---
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:dev'
          format: 'table'
          exit-code: '1' # Bloque le pipeline si une faille CRITICAL est trouvée
          severity: 'CRITICAL'

      - name: Push Image to Hub
        run: docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:dev

      # --- POINT 5.3 : NOTIFICATION ---
      - name: Notification Email
        if: always() # S'exécute même si le scan échoue pour prévenir l'admin
        run: |
          echo "Envoi du rapport à moussawade@groupeisi.com"
          echo "Statut du job : ${{ job.status }}"